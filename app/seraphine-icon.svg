    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ffd6f0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd6f0" stop-opacity="0"/>
